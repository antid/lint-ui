<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>clipping-pass fixture</title>
  </head>
  <body>
    <main>
      <h1>Clipping pass</h1>
      <p>Ordinary paragraphs flow without any height constraint.</p>
      <pre style="max-width: 100%; max-height: 80px; overflow: auto;">line 1
line 2
line 3
line 4
line 5
line 6
line 7
line 8
line 9
line 10</pre>
      <span style="display: block; max-width: 120px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">An intentionally truncated label with ellipsis</span>
      <div style="height: 2000px;">
        Tall content forces document scrolling. A scrolled page must not
        report its root element as clipped text.
      </div>
    </main>
  </body>
</html>
