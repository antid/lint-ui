name: Lint UI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  # Fast static checks across operating systems (M6). Browser-dependent E2E
  # stays in the lint-ui job on Ubuntu; without LINT_UI_BROWSER_TESTS the
  # fixture tests skip and unit coverage is identical everywhere.
  static-checks:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm build

      - name: Lint
        run: pnpm lint

      - name: Run unit tests
        run: pnpm test

  lint-ui:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
      
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        # Before unit tests: the env-gated layout fixture tests need Chromium.
        run: npx playwright install --with-deps chromium
        working-directory: packages/runner

      - name: Build packages
        run: pnpm build

      - name: Lint
        run: pnpm lint

      - name: Run unit tests
        run: pnpm test
        env:
          LINT_UI_BROWSER_TESTS: '1'

      - name: Type-check packages
        run: pnpm typecheck
      
      - name: Build example app
        run: pnpm build
        working-directory: examples/react-vite
      
      - name: Start preview server
        working-directory: examples/react-vite
        run: |
          test -d dist || { echo "ERROR: dist/ is missing - the example build produced no output"; exit 1; }
          # Bind all interfaces so 127.0.0.1 works regardless of localhost
          # IPv6/IPv4 resolution. strictPort fails fast instead of silently
          # moving to another port we are not health-checking. npx calls the
          # local vite binary directly so no arg-forwarding is involved.
          nohup npx vite preview --host 0.0.0.0 --port 4173 --strictPort > /tmp/preview.log 2>&1 &
          echo $! > /tmp/preview.pid
          sleep 3
          if ! kill -0 "$(cat /tmp/preview.pid)" 2>/dev/null; then
            echo "Preview process exited immediately. Logs:"
            cat /tmp/preview.log
            exit 1
          fi
      
      - name: Wait for server
        run: |
          timeout 60 bash -c 'until curl -fs http://127.0.0.1:4173/ > /dev/null; do sleep 1; done' || {
            echo "Preview server not reachable at http://127.0.0.1:4173/. Logs:"
            cat /tmp/preview.log
            echo "--- listening sockets ---"
            (ss -ltn 2>/dev/null || netstat -ltn 2>/dev/null || true)
            exit 1
          }
      
      - name: Download baseline screenshots
        uses: actions/cache/restore@v3
        id: baseline-cache
        with:
          path: examples/react-vite/.ui-baseline
          # restore-only (never post-saves): PR jobs must not write the shared
          # bucket. v2 prefix abandons the v1 bucket: the example app visuals
          # changed intentionally (a11y contrast and heading fixes), so old
          # baselines no longer match. Cache keys are immutable.
          key: ui-baseline-v2-${{ github.base_ref || github.ref_name }}
      
      - name: Record baseline (if not cached)
        if: steps.baseline-cache.outputs.cache-hit != 'true'
        run: cd examples/react-vite && node ../../packages/cli/bin/dev.js record
      
      - name: List baseline screenshots
        run: ls -la examples/react-vite/.ui-baseline
      
      - name: Run Lint UI checks
        id: lint-ui
        run: cd examples/react-vite && node ../../packages/cli/bin/dev.js run
        continue-on-error: true
      
      - name: Repeatability check (5 consecutive runs)
        # M2 exit criterion: an unchanged fixture must produce zero visual
        # diffs across five consecutive runs. Each run overwrites current/
        # and report.json; any failure fails the job immediately.
        run: |
          cd examples/react-vite
          for i in 1 2 3 4 5; do
            echo "--- repeatability run $i/5 ---"
            node ../../packages/cli/bin/dev.js run || exit 1
          done
      
      - name: External-install smoke test
        # M6: deploys the built CLI outside the monorepo and runs the full
        # init/record/run flow from a scratch project. Reuses the preview
        # server and browsers from the steps above.
        run: bash .github/scripts/smoke-external-install.sh
      
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-ui-results
          path: |
            examples/react-vite/.lint-ui/
            !examples/react-vite/.lint-ui/temp/
          retention-days: 30
      
      - name: Upload preview log (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: preview-log
          path: /tmp/preview.log
          retention-days: 7
      
      - name: Upload baseline screenshots
        if: github.ref == 'refs/heads/main'
        uses: actions/cache@v3
        with:
          path: examples/react-vite/.ui-baseline
          # Must equal the restore key above (ref_name is bare "main",
          # without the refs/heads/ prefix the old key used).
          key: ui-baseline-v2-${{ github.ref_name }}
      
      - name: Comment PR
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const reportPath = 'examples/react-vite/.lint-ui/report.md';
            
            let comment = '## 🎨 Lint UI Results\n\n';
            
            if (fs.existsSync(reportPath)) {
              comment += fs.readFileSync(reportPath, 'utf8');
            } else {
              comment += '${{ steps.lint-ui.outcome }}' === 'success' 
                ? '✅ All visual regression tests passed!'
                : '❌ Visual regression tests failed. Check artifacts for details.';
            }
            
            comment += '\n\n[View full artifacts](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})';
            
            try {
              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: comment
              });
            } catch (error) {
              core.warning(`Could not create PR comment (expected for fork PRs with read-only token): ${error.message}`);
            }
      
      - name: Fail if tests failed
        if: steps.lint-ui.outcome == 'failure'
        run: exit 1
